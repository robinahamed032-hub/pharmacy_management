{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h2 class="fw-bold mb-4">{{ title }}</h2><form method="post">{% csrf_token %}<div class="row g-3">{% for field in form %}<div class="col-md-6"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}</div>{% endfor %}</div><div class="mt-4"><button class="btn btn-primary">Save</button><a href="{% url 'medicines' %}" class="btn btn-light ms-2">Cancel</a></div></form></div></div></div></div>{% endblock %}
