{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h2 class="fw-bold mb-4">Create Sale</h2><form method="post">{% csrf_token %}<label class="form-label">Customer name</label><input name="customer_name" class="form-control mb-3" placeholder="Walk-in Customer"><label class="form-label">Customer phone</label><input name="customer_phone" class="form-control mb-3"><label class="form-label">Medicine</label><select name="medicine" class="form-select mb-3" required><option value="">Choose medicine...</option>{% for m in medicines %}<option value="{{ m.pk }}">{{ m.name }} — ৳{{ m.selling_price }} ({{ m.stock }} available)</option>{% endfor %}</select><label class="form-label">Quantity</label><input name="quantity" type="number" min="1" class="form-control mb-4" required><button class="btn btn-primary">Record Sale</button><a href="{% url 'sales' %}" class="btn btn-light ms-2">Cancel</a></form></div></div></div></div>{% endblock %}
