{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h2 class="fw-bold">Suppliers</h2><a class="btn btn-primary" href="{% url 'supplier_add' %}">＋ Add Supplier</a></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th></tr></thead><tbody>{% for s in suppliers %}<tr><td><b>{{ s.name }}</b></td><td>{{ s.phone|default:'—' }}</td><td>{{ s.email|default:'—' }}</td><td>{{ s.address|default:'—' }}</td></tr>{% empty %}<tr><td colspan="4" class="text-center py-5 text-muted">No suppliers yet.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
