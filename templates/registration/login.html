{% load static %}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login · MediCare Pharmacy</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body class="login-page"><div class="login-card shadow"><div class="brand-icon">✚</div><h2 class="text-center mb-1">MediCare Pharmacy</h2><p class="text-center text-muted mb-4">Secure staff login</p>{% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}<form method="post">{% csrf_token %}<label class="form-label">Username</label><input class="form-control mb-3" name="username" autofocus required><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required><button class="btn btn-primary w-100 py-2">Sign in</button></form><p class="small text-center text-muted mt-4 mb-0">Pharmacy Management System</p></div></body></html>
